<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IUT Blood Donor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: #fef2f2;
      --surface: #ffffff;
      --bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
    .hidden { display: none !important; }

    header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .logo-icon { width: 40px; height: 40px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 20px; }
    h1 { font-size: 24px; font-weight: 700; color: var(--text); }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .auth-card { text-align: center; max-width: 400px; margin: 40px auto; }

    .btn { background-color: var(--primary); color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background-color: #f1f5f9; }

    /* Feed Container styling with max-height overflow */
    #urgentFeed { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; max-height: 420px; overflow-y: auto; padding-right: 4px; }

    .urgent-banner { background-color: #fef2f2; border: 1px solid #fca5a5; border-radius: var(--radius); padding: 16px; color: #991b1b; }
    .urgent-header { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }

    .donors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
    .donor-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .donor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .donor-name { font-weight: 600; font-size: 15px; }
    .blood-badge { background: var(--primary-light); color: var(--primary); font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 6px; }
    .status-badge { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 20px; display: inline-block; }
    .status-eligible { background: #dcfce7; color: #15803d; }
    .status-ineligible { background: #fef3c7; color: #b45309; }

    .filter-bar { display: flex; gap: 12px; align-items: center; background: white; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar select { width: auto; flex: 1; min-width: 140px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-icon">🩸</div>
    <h1>IUT Blood Donor Portal</h1>
    <p class="subtitle">A unified campus network for blood donation</p>
  </header>

  <!-- Login Section -->
  <div id="authSection" class="card auth-card">
    <h2 style="font-size: 18px; margin-bottom: 8px;">Welcome Back</h2>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Please sign in using your official university email to continue.</p>
    <button id="loginBtn" class="btn" style="width: 100%;">Sign in with Google</button>
  </div>

  <!-- Signed In User Bar -->
  <div id="userInfo" class="card flex-between hidden" style="padding: 12px 20px; margin-bottom: 20px;">
    <span style="font-size: 13px; color: var(--text-muted);">Signed in as <strong id="userEmail" style="color: var(--text);"></strong></span>
    <button id="logoutBtn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Sign Out</button>
  </div>

  <!-- Main App Content -->
  <div id="appContent" class="hidden">

    <!-- Emergency Requests Feed -->
    <div id="urgentFeed"></div>

    <div class="flex-between" style="margin-bottom: 16px;">
      <h2 style="font-size: 18px; font-weight: 700;">Dashboard</h2>
      <button id="openUrgentModalBtn" class="btn">+ Post Emergency Need</button>
    </div>

    <!-- Create Emergency Request Form Card -->
    <div id="urgentFormCard" class="card hidden" style="border-left: 4px solid var(--primary);">
      <h3 style="font-size: 16px; margin-bottom: 12px;">Post Emergency Need</h3>
      <form id="urgentForm">
        <div class="grid-2">
          <div class="form-group">
            <label>Required Blood Group</label>
            <select id="urgentBloodGroup" required>
              <option value="A+">A+</option><option value="A-">A-</option>
              <option value="B+">B+</option><option value="B-">B-</option>
              <option value="O+">O+</option><option value="O-">O-</option>
              <option value="AB+">AB+</option><option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label>Hospital / Location</label>
            <input type="text" id="urgentHospital" placeholder="e.g. Chittagong Medical Centre" required>
          </div>
        </div>
        <div class="form-group">
          <label>Contact Phone Number</label>
          <input type="tel" id="urgentPhone" placeholder="017XXXXXXXX" required>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancelUrgentBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn">Broadcast Request</button>
        </div>
      </form>
    </div>

    <!-- My Profile Section -->
    <div class="card">
      <h3 style="font-size: 16px; margin-bottom: 16px;">My Donor Profile</h3>
      <form id="profileForm">
        <div class="grid-2">
          <div class="form-group">
            <label>Blood Group</label>
            <select id="bloodGroup">
              <option value="A+">A+</option><option value="A-">A-</option>
              <option value="B+">B+</option><option value="B-">B-</option>
              <option value="O+">O+</option><option value="O-">O-</option>
              <option value="AB+">AB+</option><option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="017XXXXXXXX" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Last Donated Date (Leave blank if never)</label>
            <input type="date" id="lastDonated">
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 24px;">
            <input type="checkbox" id="isAvailable" style="width: auto;" checked>
            <label for="isAvailable" style="margin-bottom: 0; cursor: pointer;">Available for Emergency Calls</label>
          </div>
        </div>
        <button type="submit" class="btn" style="margin-top: 8px;">Save Profile</button>
      </form>
    </div>

    <!-- Donor Directory Section -->
    <div style="margin-top: 32px;">
      <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">Campus Donor Directory</h3>
      
      <!-- Filter Bar -->
      <div class="filter-bar">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Filter By:</span>
        <select id="filterBloodGroup">
          <option value="ALL">All Blood Groups</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
        </select>
        <select id="filterEligibility">
          <option value="ALL">All Availability</option>
          <option value="ELIGIBLE">Eligible Donors Only (90+ Days)</option>
        </select>
      </div>

      <div id="donorsList" class="donors-grid"></div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
